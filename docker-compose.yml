services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: taxledger
      POSTGRES_PASSWORD: taxledger
      POSTGRES_DB: taxledger
    ports:
      - "5432:5432"
    volumes:
      - taxledger_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxledger -d taxledger"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  taxledger_pgdata:
